<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Middle — Login</title>
  <style>
    @font-face { font-family:"Filson Soft"; src:url("./fonts/FilsonSoft-Regular.woff2") format("woff2"); font-weight:400; font-style:normal; font-display:swap; }
    @font-face { font-family:"Filson Soft"; src:url("./fonts/FilsonSoft-Medium.woff2") format("woff2"); font-weight:500; font-style:normal; font-display:swap; }
    @font-face { font-family:"Filson Soft"; src:url("./fonts/FilsonSoft-Bold.woff2") format("woff2"); font-weight:700; font-style:normal; font-display:swap; }

    :root {
      --teal:#08a7ad;
      --teal-dark:#078e98;
      --ink:#4d555a;
      --white:#fff;
    }

    * { box-sizing:border-box; }
    html,body { margin:0; min-height:100%; }
    body {
      min-height:100dvh;
      display:flex;
      justify-content:center;
      background:#343838;
      font-family:"Filson Soft","Avenir Next",Arial,sans-serif;
      color:var(--ink);
    }
    button,input { font:inherit; }

    .mobile-login {
      position:relative;
      width:100%;
      max-width:430px;
      min-height:100dvh;
      overflow:hidden;
      background:
        radial-gradient(circle at 85% 9%, rgba(255,255,255,.17), transparent 30%),
        radial-gradient(circle at 16% 72%, rgba(255,255,255,.08), transparent 34%),
        linear-gradient(155deg,#68c9ca 0%,#35b9bc 33%,#0aa4ac 67%,#078b97 100%);
      box-shadow:0 0 50px rgba(0,0,0,.18);
    }

    .hero {
      position:relative;
      height:55dvh;
      min-height:430px;
      padding:max(56px,env(safe-area-inset-top)) 36px 54px;
      color:#fff;
    }

    .brand-logo {
      display:block;
      width:194px;
      height:auto;
      filter:brightness(0) invert(1);
    }

    .welcome { margin-top:44px; max-width:330px; }
    .welcome h1 {
      margin:0;
      font-size:37px;
      line-height:1.02;
      letter-spacing:.01em;
      font-weight:700;
      text-transform:uppercase;
    }
    .welcome p {
      margin:18px 0 0;
      max-width:310px;
      font-size:15px;
      line-height:1.52;
      color:rgba(255,255,255,.78);
    }

    .form-sheet {
      position:relative;
      z-index:2;
      margin-top:-46px;
      min-height:calc(45dvh + 46px);
      padding:0 34px max(42px,env(safe-area-inset-bottom));
      background:#fff;
      border-radius:52px 52px 0 0;
      box-shadow:0 -12px 34px rgba(0,100,105,.07);
    }

    .login-form { position:relative; top:-26px; }

    .field {
      display:flex;
      align-items:center;
      width:100%;
      height:64px;
      margin-bottom:17px;
      background:#fff;
      border:1px solid rgba(220,225,227,.92);
      border-radius:20px;
      box-shadow:0 9px 22px rgba(58,78,84,.12);
      transition:.18s ease;
    }
    .field:focus-within {
      border-color:rgba(8,167,173,.58);
      box-shadow:0 0 0 4px rgba(8,167,173,.08),0 10px 24px rgba(58,78,84,.13);
      transform:translateY(-1px);
    }
    .field-icon {
      width:56px;
      flex:0 0 56px;
      display:grid;
      place-items:center;
      color:var(--teal-dark);
    }
    .field-icon svg,.eye-button svg { width:21px; height:21px; display:block; }
    .field input {
      width:100%; min-width:0; height:100%; padding:0 8px 0 0;
      border:0; outline:0; background:transparent;
      color:var(--ink); font-size:15.5px;
    }
    .field input::placeholder { color:#8e9498; opacity:1; }
    .eye-button {
      appearance:none; width:54px; height:54px; flex:0 0 54px;
      display:grid; place-items:center; padding:0; border:0;
      border-radius:16px; background:transparent; color:var(--teal-dark); cursor:pointer;
    }

    .options {
      display:flex; align-items:center; justify-content:space-between; gap:14px;
      margin:0 5px 42px; font-size:13.5px; color:#6e767b;
    }
    .remember { display:inline-flex; align-items:center; gap:9px; cursor:pointer; user-select:none; }
    .remember input {
      appearance:none; width:17px; height:17px; margin:0;
      border:1.6px solid #b7bec1; border-radius:50%; background:#fff; cursor:pointer;
    }
    .remember input:checked { border:4px solid #fff; outline:1.5px solid var(--teal); background:var(--teal); }
    .forgot { color:var(--teal-dark); text-decoration:none; font-weight:500; }

    .login-button {
      display:block; width:134px; height:44px; margin:0 auto;
      border:0; border-radius:999px;
      background:linear-gradient(90deg,#33b2b6,#229da6);
      color:#fff; font-size:13.5px; font-weight:700; letter-spacing:.035em;
      text-transform:uppercase; cursor:pointer;
      box-shadow:0 9px 20px rgba(26,146,154,.23);
    }
    .login-button:active { transform:translateY(1px); }
    .company {
      margin:18px 0 0; text-align:center; font-size:13px; letter-spacing:.04em;
      color:#687075; text-transform:uppercase;
    }

    @media (max-height:740px) {
      .hero { height:53dvh; min-height:380px; padding-top:max(42px,env(safe-area-inset-top)); }
      .welcome { margin-top:28px; }
      .welcome h1 { font-size:34px; }
      .options { margin-bottom:28px; }
    }
    @media (max-width:360px) {
      .hero { padding-left:28px; padding-right:28px; }
      .form-sheet { padding-left:28px; padding-right:28px; }
      .brand-logo { width:176px; }
      .welcome h1 { font-size:34px; }
    }
  </style>
</head>
<body>
  <main class="mobile-login">
    <section class="hero">
      <img class="brand-logo" src="./wwwroot/images/middle-logo.png" alt="Middle" />
      <div class="welcome">
        <h1>Welcome<br />Back!</h1>
        <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed diam nonummy asd.</p>
      </div>
    </section>

    <section class="form-sheet">
      <form class="login-form" id="loginForm">
        <label class="field" aria-label="Username or email">
          <span class="field-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z" fill="currentColor" opacity=".78"/><path d="M4.5 20c.55-4 3.03-6 7.5-6s6.95 2 7.5 6H4.5Z" fill="currentColor"/></svg>
          </span>
          <input type="text" name="username" autocomplete="username" placeholder="Username/Email" />
        </label>

        <label class="field" aria-label="Password">
          <span class="field-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none"><rect x="5.5" y="9.5" width="13" height="10.5" rx="2.4" fill="currentColor" opacity=".88"/><path d="M8.2 9.5V7.3a3.8 3.8 0 0 1 7.6 0v2.2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><circle cx="12" cy="14.8" r="1.25" fill="white"/></svg>
          </span>
          <input id="password" type="password" name="password" autocomplete="current-password" placeholder="Password" />
          <button class="eye-button" type="button" aria-label="Show password" aria-pressed="false" onclick="togglePassword(this)">
            <svg viewBox="0 0 24 24" fill="none"><path d="M2.7 12s3.2-5 9.3-5 9.3 5 9.3 5-3.2 5-9.3 5-9.3-5-9.3-5Z" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="12" r="2.5" fill="currentColor"/></svg>
          </button>
        </label>

        <div class="options">
          <label class="remember"><input type="checkbox" name="remember" /><span>Remember me</span></label>
          <a class="forgot" href="#">Forgot password?</a>
        </div>

        <button class="login-button" type="submit">Log In</button>
        <p class="company">Jarc Group of Companies</p>
      </form>
    </section>
  </main>

  <script>
    function togglePassword(button) {
      const input = document.getElementById('password');
      const show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      button.setAttribute('aria-pressed', String(show));
      button.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
    }

    document.getElementById('loginForm').addEventListener('submit', function (event) {
      event.preventDefault();
      window.location.href = './shop.html';
    });
  </script>
</body>
</html>
